[project]
name = "aocapp"
version = "0.1.0"
description = "Desktop calculator and visualizer for superconducting integrated structures"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.1",
    "pillow==12.2.0",
    "pyqtgraph==0.14.0",
    "pyside6==6.10.1",
    "requests==2.32.3",
    "scipy==1.17.0",
]

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "black==23.9.1",
    "isort==5.12.0",
    "pyinstaller==6.20.0",
    "pytest==7.4.2",
    "ruff==0.0.287",
]

[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
(
    \.eggs
  | \.git
  | \.tox
  | build
  | dist
  | venv
  | docs
)
'''

[tool.isort]
profile = "black"
line_length = 120
include_trailing_comma = true
combine_as_imports = true
remove_redundant_aliases = true

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "I"]
ignore = ["E501", "E711", "E731", "F401", "F841", "I001"]
unfixable = ["T20", "E711"]

[tool.ruff.per-file-ignores]
"*/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["aocapp*"]
