name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  packages: write
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-2022
            arch: x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run build script (Windows)
        if: runner.os == 'Windows'
        run: .\build.bat

      - name: Archive Release Asset (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path ./dist/SMC_app -DestinationPath ./dist/SMC_app_${{ runner.os }}_${{ matrix.arch }}_${{ github.ref_name }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: SMC_app_${{ runner.os }}_${{ matrix.arch }}_${{ github.ref_name }}
          path: |
            ./dist/SMC_app_${{ runner.os }}_${{ matrix.arch }}_${{ github.ref_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: SMC_app_*_${{ github.ref_name }}
          merge-multiple: true

      - name: List contents
        run: ls -l .
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          preserve_order: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            SMC_app_Windows_x64_${{ github.ref_name }}.zip
