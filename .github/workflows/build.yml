name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  packages: write
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-2022
            arch: x86
          - os: windows-2022
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run build script (Windows)
        if: runner.os == 'Windows'
        run: .\build.bat

      - name: Run build script (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./build.sh

      - name: Archive Release Asset (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path ./dist/SMC_app -DestinationPath ./dist/SMC_app_${{ runner.os }}_${{ matrix.arch }}_${{ github.ref_name }}.zip

      - name: Archive Release Asset (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          if [ -d "SMC_app.app" ]; then
            zip -r SMC_app_${{ runner.os }}_${{ matrix.arch }}_${{ github.ref_name }}.zip SMC_app.app
          else
            zip -r SMC_app_${{ runner.os }}_${{ matrix.arch }}_${{ github.ref_name }}.zip SMC_app
          fi
          ls -l

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: SMC_app_${{ runner.os }}_${{ matrix.arch }}_${{ github.ref_name }}
          path: |
            ./dist/SMC_app_${{ runner.os }}_${{ matrix.arch }}_${{ github.ref_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Artifacts (all OS)
        uses: actions/download-artifact@v7
        with:
          pattern: SMC_app_*_${{ github.ref_name }}
          merge-multiple: true

      - name: List contents
        run: ls -l .
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            SMC_app_Windows_x64_${{ github.ref_name }}.zip
            SMC_app_Windows_x86_${{ github.ref_name }}.zip
            SMC_app_macOS_arm64_${{ github.ref_name }}.zip
            SMC_app_macOS_x64_${{ github.ref_name }}.zip
